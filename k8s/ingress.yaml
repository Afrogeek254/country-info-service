# Requires an ingress controller (minikube: "minikube addons enable ingress").
# Only /api is exposed; /actuator stays cluster-internal.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: country-info-service
  namespace: country-info
spec:
  ingressClassName: nginx
  rules:
    - host: country-info.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: country-info-service
                port:
                  name: http
