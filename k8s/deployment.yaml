apiVersion: apps/v1
kind: Deployment
metadata:
  name: country-info-service
  namespace: country-info
  labels:
    app: country-info-service
spec:
  replicas: 2                       # stateless service: scale horizontally (HPA adjusts this)
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0             # never drop below desired capacity during a rollout
      maxSurge: 1
  selector:
    matchLabels:
      app: country-info-service
  template:
    metadata:
      labels:
        app: country-info-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:    # spread replicas across nodes
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: country-info-service
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 3; done"]
      containers:
        - name: app
          image: country-info-service:1.0.0     # overwritten by scripts/deploy.* (kubectl set image)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: country-info-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: country-info-secret, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: country-info-secret, key: DB_PASSWORD }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 768Mi }
          startupProbe:             # gives the JVM up to 150s to boot before liveness starts
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:            # restart if the JVM is wedged
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:           # remove from Service endpoints if DB is unreachable
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:                # let the endpoint removal propagate before the JVM starts draining
              exec:
                command: ["sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
